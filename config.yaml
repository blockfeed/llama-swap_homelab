# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# llama-swap config — AMD RX 7900 XTX (24GB VRAM, gfx1100, ROCm)

healthCheckTimeout: 180
globalTTL: 3600
includeAliasesInList: true
logToStdout: "both"
sendLoadingState: true
startPort: 8081

performance:
  disabled: false
  every: 15s

hooks:
  on_startup:
    preload:
      - "qwen36-plan"

macros:
  "base": >
    /usr/bin/llama-server
    --port ${PORT}
    --n-gpu-layers 999
    --cache-type-k q4_0
    --cache-type-v q4_0
    --host 0.0.0.0
    --jinja
    --flash-attn on
    -ub 2048
    -b 2048

  "qwen36_agent": >
    ${base}
    --reasoning off
    --chat-template-kwargs '{"preserve_thinking":true}'
    --temp 0.7
    --top-p 0.8
    --top-k 20
    --min-p 0.0
    --presence-penalty 1.5
    -b 512
    -ub 512

  "qwen36_mtp_agent": >
    ${base}
    --parallel 1
    --cache-ram 0
    --reasoning off
    --chat-template-kwargs '{"preserve_thinking":true}'
    --temp 0.7
    --top-p 0.8
    --top-k 20
    --min-p 0.0
    --presence-penalty 1.5
    -b 512
    -ub 512
    --spec-type draft-mtp
    --spec-draft-n-max 2

  "gemma4_mtp": >
    /usr/bin/llama-server
    --port ${PORT}
    --n-gpu-layers 999
    --cache-type-k q4_0
    --cache-type-v q4_0
    --host 0.0.0.0
    --jinja
    --flash-attn on
    --parallel 1
    --cache-ram 0
    --temp 1.0
    --top-p 0.95
    --top-k 64
    -b 512
    -ub 512
    --spec-type draft-mtp
    --spec-draft-n-max 3
    --chat-template-kwargs '{"enable_thinking":false}'

  "gemma4_12b_mtp": >
    /usr/bin/llama-server
    --port ${PORT}
    --n-gpu-layers 999
    --cache-type-k q4_0
    --cache-type-v q4_0
    --host 0.0.0.0
    --jinja
    --flash-attn on
    --parallel 1
    --cache-ram 0
    --temp 1.0
    --top-p 0.95
    --top-k 64
    -b 512
    -ub 512
    --spec-type draft-mtp
    --spec-draft-n-max 4
    --chat-template-kwargs '{"enable_thinking":false}'

  "glm47_flash": >
    ${base}
    --chat-template-kwargs '{"enable_thinking":false}'
    --temp 1.0
    --top-p 0.95
    --min-p 0.01
    --repeat-penalty 1.0
    -b 512
    -ub 512

  "rocinante_general": >
    ${base}
    --temp 0.7
    --top-p 0.9
    --top-k 40
    --min-p 0.0
    --repeat-penalty 1.1

models:
  "qwen36-35b-a3b-mtp":
    name: "Qwen3.6 35B A3B MTP"
    cmd: >
      ${qwen36_mtp_agent}
      --model /opt/llama/models/Qwen3.6-35B-A3B-MTP/Qwen3.6-35B-A3B-UD-Q4_K_S.gguf
      --ctx-size 262144
    ttl: 28800
    metadata:
      role: developer
    filters:
      setParams:
        chat_template_kwargs:
          enable_thinking: false
          preserve_thinking: true
      setParamsByID:
        "qwen36-code":
          temperature: 0.6
          top_p: 0.95
          top_k: 20
          min_p: 0.0
          presence_penalty: 0.0
          chat_template_kwargs:
            enable_thinking: false
            preserve_thinking: true
        "qwen36-plan":
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          min_p: 0.0
          presence_penalty: 1.5
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: true
    aliases:
      - "qwen36-code"
      - "qwen36-plan"

  "gemma4-26b-a4b-mtp":
    name: "Gemma 4 26B A4B MTP"
    cmd: >
      ${gemma4_mtp}
      --model /opt/llama/models/unsloth_gemma-4-26B-A4B-it-GGUF/gemma-4-26B-A4B-it-UD-Q4_K_XL.gguf
      --model-draft /opt/llama/models/unsloth_gemma-4-26B-A4B-it-GGUF/gemma-4-26B-A4B-it-assistant-Q2_K.gguf
      --ctx-size 262144
    ttl: 28800
    metadata:
      role: developer
    filters:
      setParams:
        chat_template_kwargs:
          enable_thinking: false
      setParamsByID:
        "gemma4-code":
          chat_template_kwargs:
            enable_thinking: false
        "gemma4-plan":
          chat_template_kwargs:
            enable_thinking: true
    aliases:
      - "gemma4-code"
      - "gemma4-plan"

  "rocinante-x-12b":
    name: "Rocinante X 12B v1b (General)"
    unlisted: true
    cmd: >
      ${rocinante_general}
      --model /opt/llama/models/Rocinante-X-12B/Rocinante-X-12B-v1b-Q8_0.gguf
      --ctx-size 188416
    ttl: 28800
    metadata:
      role: user

  "qwen36-35b-a3b-vision":
    name: "Qwen3.6 35B A3B Vision"
    cmd: >
      ${qwen36_agent}
      --model /opt/llama/models/Qwen3.6-35B-A3B_vision/Qwen3.6-35B-A3B-UD-IQ4_NL_XL.gguf
      --mmproj /opt/llama/models/Qwen3.6-35B-A3B_vision/mmproj-F16.gguf
      --ctx-size 262144
    ttl: 28800
    metadata:
      role: developer
    filters:
      setParams:
        chat_template_kwargs:
          enable_thinking: false
          preserve_thinking: true
      setParamsByID:
        "qwen36-vision":
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          min_p: 0.0
          presence_penalty: 1.5
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: true
    aliases:
      - "qwen36-vision"

  "huihui-35b-abliterated":
    name: "Huihui 35B Abliterated"
    cmd: >
      ${qwen36_agent}
      --model /opt/llama/models/Huihui-Qwen3.6-35B-A3B-abliterated/Huihui-Qwen3.6-35B-A3B-abliterated-Q4_K_M.gguf
      --ctx-size 245760
    ttl: 28800
    metadata:
      role: user
    filters:
      setParamsByID:
        "huihui-35b-abliterated":
          chat_template_kwargs:
            enable_thinking: false
        "qwen36abl-plan":
          temperature: 1.0
          top_p: 0.95
          presence_penalty: 1.5
          chat_template_kwargs:
            enable_thinking: true
    aliases:
      - "qwen36abl-plan"

  "gemma4-12b-obliterated-mtp":
    name: "Gemma 4 12B Obliterated MTP"
    cmd: >
      ${gemma4_12b_mtp}
      --model /opt/llama/models/gemma4-12b-obliterated/Gemma-4-12B-OBLITERATED.Q8_0.gguf
      --model-draft /opt/llama/models/gemma4-12b-obliterated/gemma-4-12B-it-qat-assistant-MTP-Q8_0.gguf
      --ctx-size 262144
    ttl: 28800
    metadata:
      role: user
    filters:
      setParams:
        chat_template_kwargs:
          enable_thinking: false
      setParamsByID:
        "abliterated-plan":
          temperature: 1.0
          top_p: 0.95
          chat_template_kwargs:
            enable_thinking: true
    aliases:
      - "abliterated-plan"

  "glm47-flash":
    name: "GLM-4.7 Flash"
    unlisted: true
    cmd: >
      ${glm47_flash}
      --model /opt/llama/models/unsloth_GLM-4.7-Flash/GLM-4.7-Flash-UD-Q4_K_XL.gguf
      --ctx-size 202752
    ttl: 28800
    metadata:
      role: developer
    filters:
      setParams:
        chat_template_kwargs:
          enable_thinking: false
      setParamsByID:
        "glm47-flash-code":
          temperature: 0.7
          top_p: 1.0
          min_p: 0.01
          chat_template_kwargs:
            enable_thinking: false
        "glm47-flash-plan":
          temperature: 1.0
          top_p: 0.95
          min_p: 0.01
          chat_template_kwargs:
            enable_thinking: true
    aliases:
      - "glm47-flash-code"
      - "glm47-flash-plan"

